<script>
(function() {
	// Cycle through collage slides with a crossfade
	var INTERVAL_MS = 6000;   // how long each slide stays active

	document.querySelectorAll('.card-collage').forEach(function(collage) {
		var slides = collage.querySelectorAll('.collage-slide');
		if (slides.length < 2) return;
		var current = 0;

		setInterval(function() {
			// Remove active class from current slide
			slides[current].classList.remove('active');
			// Advance to the next slide
			current = (current + 1) % slides.length;
			slides[current].classList.add('active');
		}, INTERVAL_MS);
	});
})();
</script>
